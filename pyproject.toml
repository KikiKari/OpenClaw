[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "openclaw-py"
version = "0.1.0a1"
description = "OpenClaw Cluster — Python client and gateway utilities"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["openclaw", "gateway", "cluster", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://kikikari.github.io/OpenClaw/"
Repository = "https://github.com/KikiKari/OpenClaw"

[tool.setuptools.packages.find]
where = ["."]
include = ["openclaw*"]