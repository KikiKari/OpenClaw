name: Container Packages (extras)

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "assets/gen_topology.py"
      - "assets/gen_mcp_flow.py"
      - "assets/gen_mcp_flow_gif.py"
      - ".github/workflows/docker-publish-extras.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: skill-python-hardener
            dockerfile: packages/skill-python-hardener/Dockerfile
          - name: mcp-flow-svg
            dockerfile: packages/mcp-flow-svg/Dockerfile
          - name: mcp-flow-gif
            dockerfile: packages/mcp-flow-gif/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/kikikari/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
